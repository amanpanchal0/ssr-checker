<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #101828;
    background: #ffffff;
    color-scheme: light;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 4px 2px 8px;
    font-size: 13px;
    color: #344054;
    background: #ffffff;
  }
  .toolbar label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: #344054;
    font-weight: 500;
  }
  .toolbar input[type="checkbox"] {
    accent-color: #4f46e5;
    width: 15px;
    height: 15px;
  }
  .hint { color: #475467; }
  .wrap {
    display: flex;
    gap: 12px;
    height: __HEIGHT__px;
  }
  .pane {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid #d0d5dd;
    border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
  }
  .pane-header {
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .01em;
    background: #f2f4f7;
    border-bottom: 1px solid #d0d5dd;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pill { font-weight: 500; font-size: 11px; color: #475467; }
  .scroll { position: relative; overflow: auto; flex: 1 1 auto; background: #fff; }
  .scroll img { display: block; width: 100%; height: auto; }
  .scroll .swap { display: none; }
  .wrap.diff-on .scroll .base { display: none; }
  .wrap.diff-on .scroll .swap { display: block; }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: #667085;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <label><input type="checkbox" id="diffToggle" /> Highlight differences</label>
    <span class="hint" id="syncState">Scroll is synced between panes</span>
  </div>

  <div class="wrap" id="wrap">
    <div class="pane">
      <div class="pane-header">
        <span>Server-side rendered version (JS disabled)</span>
        <span class="pill">__SSR_PILL__</span>
      </div>
      <div class="scroll" id="ssrScroll">
        __SSR_BODY__
      </div>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>Regular rendered version (JS enabled)</span>
        <span class="pill">__CSR_PILL__</span>
      </div>
      <div class="scroll" id="csrScroll">
        __CSR_BODY__
      </div>
    </div>
  </div>

<script>
  (function () {
    var lock = false;

    function onScroll(src, dst) {
      if (lock) return;
      lock = true;
      var sy = src.scrollHeight - src.clientHeight;
      var dy = dst.scrollHeight - dst.clientHeight;
      if (sy > 0 && dy > 0) {
        dst.scrollTop = (src.scrollTop / sy) * dy;
      }
      var sx = src.scrollWidth - src.clientWidth;
      var dx = dst.scrollWidth - dst.clientWidth;
      if (sx > 0 && dx > 0) {
        dst.scrollLeft = (src.scrollLeft / sx) * dx;
      }
      lock = false;
    }

    var ssr = document.getElementById("ssrScroll");
    var csr = document.getElementById("csrScroll");
    if (ssr && csr) {
      ssr.addEventListener("scroll", function () { onScroll(ssr, csr); }, { passive: true });
      csr.addEventListener("scroll", function () { onScroll(csr, ssr); }, { passive: true });
    }

    var toggle = document.getElementById("diffToggle");
    var wrap = document.getElementById("wrap");
    if (toggle && wrap) {
      toggle.addEventListener("change", function () {
        wrap.classList.toggle("diff-on", toggle.checked);
        var state = document.getElementById("syncState");
        if (state) {
          state.textContent = toggle.checked
            ? "Showing pixel differences (red) over the client-rendered pane"
            : "Scroll is synced between panes";
        }
      });
    }
  })();
</script>
</body>
</html>
